[project]
name = "sofa-surf-server"
version = "0.1.0"
description = "Sofa Surf backend: Nova page understanding and grounded answers for the Fire TV browser"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "segno>=1.6.6",
    "selectolax>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]
